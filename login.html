<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เข้าสู่เว็บไซต์</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;background:#f0f4f8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
.login-box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center;}
input[type=text]{padding:10px;width:80%;margin-bottom:15px;border-radius:8px;border:1px solid #aaa;font-size:16px;}
button{padding:10px 20px;border:none;border-radius:8px;background:#ff6fcf;color:white;font-size:16px;cursor:pointer;}

</style>
</head>

<body>
    
<div class="login-box">
    <h2>Enter Your Name</h2>
    <input type="text" id="username" placeholder="Lovely ♡">
    <br>
    <button onclick="enterSite()">Enter✨</button>
</div>
<script>
function enterSite(){
    const name = document.getElementById('username').value.trim();
    if(!name){ alert("กรุณากรอกชื่อ / Please enter your name"); return; }
    localStorage.setItem("username", name);
    window.location.href = "index.html"; // ชี้ไปหน้า checklist
}
</script>
</body>

</html>
